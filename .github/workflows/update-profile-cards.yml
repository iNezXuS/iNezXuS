name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-profile-cards.yml

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=iNezXuS&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&rank_icon=github&locale=tr
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=iNezXuS&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&card_width=360&locale=tr
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pinned project card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=iNezXuS&repo=taskcave&theme=tokyonight&hide_border=true
          path: profile/taskcave-pin.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Validate generated cards
        run: |
          python - <<'PY'
          from pathlib import Path

          error_markers = (
              "something went wrong",
              "resource not accessible",
              "repository not found",
          )
          for card in Path("profile").glob("*.svg"):
              content = card.read_text(encoding="utf-8").lower()
              if any(marker in content for marker in error_markers):
                  raise SystemExit(f"Invalid profile card generated: {card}")
          PY

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile cards"
          git push
